name: Build APK diag
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          set +e
          for f in *; do
            if [ -f "$f" ] && unzip -tq "$f" >/dev/null 2>&1; then unzip -qo "$f" -d proj; echo "unzip $f kod $?"; fi
          done
          if [ ! -f proj/settings.gradle.kts ]; then echo "::error::settings topilmadi. Fayllar: $(ls | tr '\n' ' ')"; exit 1; fi
          cd proj
          gradle assembleDebug --no-daemon > ../log.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then echo "::error::GRADLE xato kod $code: $(tail -n 25 ../log.txt | tr '\n' '|')"; exit $code; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Suhbat-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
